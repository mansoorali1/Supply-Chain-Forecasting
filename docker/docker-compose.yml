# docker/docker-compose.yml
# Runs the full application stack locally for testing
# Usage: docker-compose -f docker/docker-compose.yml up

version: '3.8'

services:

  # Main Streamlit application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      # Mount these so changes reflect without rebuilding
      - ../app:/app/app
      - ../reports:/app/reports
      - ../mlruns:/app/mlruns
    environment:
      - APP_ENV=production
      - MLFLOW_TRACKING_URI=mlruns
    restart: unless-stopped

  # MLflow tracking server (optional, for local UI)
  mlflow:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/app/mlruns
    command: >
      bash -c "pip install mlflow --quiet &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri /app/mlruns"
    restart: unless-stopped
