# .github/workflows/deploy.yml
# Runs only when CI passes on main branch
# Purpose: signal Streamlit Community Cloud to redeploy
# Streamlit Community Cloud watches your main branch directly
# so this workflow primarily validates the build succeeds

name: Deploy to Streamlit

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Streamlit app starts
        run: |
          timeout 30 streamlit run app/streamlit_app.py \
            --server.headless true \
            --server.port 8501 &
          sleep 15
          curl --fail http://localhost:8501/healthz || exit 1
          echo "Streamlit app starts successfully"

      - name: Deployment notification
        run: |
          echo "Build verified. Streamlit Community Cloud will auto-deploy from main branch."
